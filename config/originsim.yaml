# Merge this section into nav_executor parameters; restart to apply.
nav_executor:
  ros__parameters:
    controller_frequency: 20.0
    xy_goal_tolerance: 0.3
    PID:
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      enable_rotation: false
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      min_max_sum_error: 1.0
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.2
      max_lookahead_dist: 1.0
      lookahead_time: 1.0
      use_interpolation: true
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      v_linear_min: -1.0
      v_linear_max: 1.0
      v_angular_min: -3.0
      v_angular_max: 3.0
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9
      max_robot_pose_search_dist: 5.0
      collision_horizon: 0.5
      collision_margin: 0.01
      max_local_plan_distance: 5.0
